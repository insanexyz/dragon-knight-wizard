<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon knight wizard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="nav">
      <h1>Dragon Knight Wizard</h1>
    </div>

    <div class="display-rules">
      <ul>
        <li>Dragon burns knight</li>
        <li>Wizard kills Dragon</li>
        <li>Knight kills wizard</li>
      </ul>

      More info:
      <ul>
        <li>Not mobile friendly yet</li>
      </ul>

      <button class="rules-btn rules-close-btn">Close</button>
    </div>

    <div class="username-popup">
      <p>Enter username</p>
      <input type="text" name="" id="username">
    </div>

    <div class="hero">
      <p class="display-username"></p>
      <p class="hello-stranger"> 💀 Hello, stranger! 💀 </p>
      <p class="battle-info">Begin the battle</p>
    </div>

    <div class="result-container">
      <div class="result player-result">
        <p class="result-emoji">?</p>
        <p class="player-result-text">Player: 0</p>
      </div>
      <div class="result computer-result">
        <p class="result-emoji">?</p>
        <p class="computer-result-text">Computer: 0</p>
      </div>
    </div>

    <div class="button-container">
        <button class="btn" id="dragon">🐲</button> 
        <button class="btn" id="knight">⚔️</button> 
        <button class="btn" id="wizard">🪄</button> 
    </div>

    <div class="rounds">
      Rounds: 0
    </div>

    <div class="rules-btn-container">
      <button class="rules-open-btn rules-btn">Rules</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
